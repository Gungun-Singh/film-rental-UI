<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::section})}">
<section>
    <div class="section-head section-head--page">
        <div>
            <p class="eyebrow">Customers</p>
            <h1 class="page-title">Find a customer quickly</h1>
            <p class="page-subtitle">Open a profile to review contact details, rental history, and payments.</p>
        </div>
    </div>
    <article class="panel panel--narrow">
        <h2 class="panel-title">Customer search</h2>
        <form class="form-grid" method="get" th:action="@{/customers/open}">
            <label class="field">
                <span>Customer ID</span>
                <input type="number" name="customerId" min="1" required>
            </label>
            <button class="btn btn-primary" type="submit">Open profile</button>
        </form>
    </article>
</section>
</html>
