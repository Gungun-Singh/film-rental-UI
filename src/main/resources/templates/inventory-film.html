<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::section})}">
<section>
    <div class="section-head section-head--page">
        <div>
            <p class="eyebrow">Film copies</p>
            <h1 class="page-title">Inventory for film <span th:text="${filmId}">1</span></h1>
            <p class="page-subtitle">Where this title is currently available.</p>
        </div>
    </div>
    <div class="table-wrap" th:if="${not #lists.isEmpty(inventories)}">
        <table>
            <thead>
            <tr>
                <th>Inventory</th>
                <th>Film</th>
                <th>Store</th>
                <th>Status</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="inventory : ${inventories}">
                <td th:text="${inventory['inventoryId']}">1</td>
                <td th:text="${inventory['filmTitle']} ?: 'Unavailable'">Film</td>
                <td th:text="${inventory['storeId']} ?: 'Unavailable'">1</td>
                <td th:text="${inventory['available']} ?: 'Unavailable'">true</td>
            </tr>
            </tbody>
        </table>
    </div>
    <div class="empty-state" th:if="${#lists.isEmpty(inventories)}">No copies were found for this film.</div>
</section>
</html>
